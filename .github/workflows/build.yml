name: Build IPA
 
on:
  workflow_dispatch:
  push:
    branches: [main]
 
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install XcodeGen
        run: brew install xcodegen
 
      - name: Generate Xcode project
        run: xcodegen generate
 
      - name: Build (unsigned)
        run: |
          xcodebuild -project FelisMusic.xcodeproj \
            -scheme FelisMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
 
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FelisMusic.app Payload/
          zip -r FelisMusic.ipa Payload
 
      - uses: actions/upload-artifact@v4
        with:
          name: FelisMusic-ipa
          path: FelisMusic.ipa
